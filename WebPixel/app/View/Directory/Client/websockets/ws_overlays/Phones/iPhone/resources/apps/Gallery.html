	    <script type="text/javascript">
		    (function() {
				var initPhotoSwipeFromDOM = function(gallerySelector) {
					var parseThumbnailElements = function(el) {
					    var thumbElements = el.childNodes,
					        numNodes = thumbElements.length,
					        items = [],
					        el,
					        childElements,
					        thumbnailEl,
					        size,
					        item;

					    for(var i = 0; i < numNodes; i++) {
					        el = thumbElements[i];

					        // include only element nodes 
					        if(el.nodeType !== 1) {
					          continue;
					        }

					        childElements = el.children;

					        size = el.getAttribute('data-size').split('x');

					        // create slide object
					        item = {
								src: el.getAttribute('href'),
								w: parseInt(size[0], 10),
								h: parseInt(size[1], 10),
								author: el.getAttribute('data-author')
					        };

					        item.el = el; // save link to element for getThumbBoundsFn

					        if(childElements.length > 0) {
					          item.msrc = childElements[0].getAttribute('src'); // thumbnail url
					          if(childElements.length > 1) {
					              item.title = childElements[1].innerHTML; // caption (contents of figure)
					          }
					        }


							var mediumSrc = el.getAttribute('data-med');
				          	if(mediumSrc) {
				            	size = el.getAttribute('data-med-size').split('x');
				            	// "medium-sized" image
				            	item.m = {
				              		src: mediumSrc,
				              		w: parseInt(size[0], 10),
				              		h: parseInt(size[1], 10)
				            	};
				          	}
				          	// original image
				          	item.o = {
				          		src: item.src,
				          		w: item.w,
				          		h: item.h
				          	};

					        items.push(item);
					    }

					    return items;
					};

					// find nearest parent element
					var closest = function closest(el, fn) {
					    return el && ( fn(el) ? el : closest(el.parentNode, fn) );
					};

					var onThumbnailsClick = function(e) {
					    e = e || window.event;
					    e.preventDefault ? e.preventDefault() : e.returnValue = false;

					    var eTarget = e.target || e.srcElement;

					    var clickedListItem = closest(eTarget, function(el) {
					        return el.tagName === 'A';
					    });

					    if(!clickedListItem) {
					        return;
					    }

					    var clickedGallery = clickedListItem.parentNode;

					    var childNodes = clickedListItem.parentNode.childNodes,
					        numChildNodes = childNodes.length,
					        nodeIndex = 0,
					        index;

					    for (var i = 0; i < numChildNodes; i++) {
					        if(childNodes[i].nodeType !== 1) { 
					            continue; 
					        }

					        if(childNodes[i] === clickedListItem) {
					            index = nodeIndex;
					            break;
					        }
					        nodeIndex++;
					    }

					    if(index >= 0) {
					        openPhotoSwipe( index, clickedGallery );
					    }
					    return false;
					};

					var photoswipeParseHash = function() {
						var hash = window.location.hash.substring(1),
					    params = {};

					    if(hash.length < 5) { // pid=1
					        return params;
					    }

					    var vars = hash.split('&');
					    for (var i = 0; i < vars.length; i++) {
					        if(!vars[i]) {
					            continue;
					        }
					        var pair = vars[i].split('=');  
					        if(pair.length < 2) {
					            continue;
					        }           
					        params[pair[0]] = pair[1];
					    }

					    if(params.gid) {
					    	params.gid = parseInt(params.gid, 10);
					    }

					    return params;
					};

					var openPhotoSwipe = function(index, galleryElement, disableAnimation, fromURL) {
					    var pswpElement = document.querySelectorAll('.pswp')[0],
					        gallery,
					        options,
					        items;

						items = parseThumbnailElements(galleryElement);

					    // define options (if needed)
					    options = {

					        galleryUID: galleryElement.getAttribute('data-pswp-uid'),

					        getThumbBoundsFn: function(index) {
					            // See Options->getThumbBoundsFn section of docs for more info
					            var thumbnail = items[index].el.children[0],
					                pageYScroll = window.pageYOffset || document.documentElement.scrollTop,
					                rect = thumbnail.getBoundingClientRect(); 

					            return {x:rect.left, y:rect.top + pageYScroll, w:rect.width};
					        },

					        addCaptionHTMLFn: function(item, captionEl, isFake) {
								if(!item.title) {
									captionEl.children[0].innerText = '';
									return false;
								}
								captionEl.children[0].innerHTML = item.title +  '<br/><small>Photo: ' + item.author + '</small>';
								return true;
					        }
							
					    };


					    if(fromURL) {
					    	if(options.galleryPIDs) {
					    		// parse real index when custom PIDs are used 
					    		// http://photoswipe.com/documentation/faq.html#custom-pid-in-url
					    		for(var j = 0; j < items.length; j++) {
					    			if(items[j].pid == index) {
					    				options.index = j;
					    				break;
					    			}
					    		}
						    } else {
						    	options.index = parseInt(index, 10) - 1;
						    }
					    } else {
					    	options.index = parseInt(index, 10);
					    }

					    // exit if index not found
					    if( isNaN(options.index) ) {
					    	return;
					    }



						var radios = document.getElementsByName('gallery-style');
						for (var i = 0, length = radios.length; i < length; i++) {
						    if (radios[i].checked) {
						        if(radios[i].id == 'radio-all-controls') {

						        } else if(radios[i].id == 'radio-minimal-black') {
						        	options.mainClass = 'pswp--minimal--dark';
							        options.barsSize = {top:0,bottom:0};
									options.captionEl = false;
									options.fullscreenEl = false;
									options.shareEl = false;
									options.bgOpacity = 0.85;
									options.tapToClose = true;
									options.tapToToggleControls = false;
						        }
						        break;
						    }
						}

					    if(disableAnimation) {
					        options.showAnimationDuration = 0;
					    }

					    // Pass data to PhotoSwipe and initialize it
					    gallery = new PhotoSwipe( pswpElement, PhotoSwipeUI_Default, items, options);

					    // see: http://photoswipe.com/documentation/responsive-images.html
						var realViewportWidth,
						    useLargeImages = false,
						    firstResize = true,
						    imageSrcWillChange;

						gallery.listen('beforeResize', function() {

							var dpiRatio = window.devicePixelRatio ? window.devicePixelRatio : 1;
							dpiRatio = Math.min(dpiRatio, 2.5);
						    realViewportWidth = gallery.viewportSize.x * dpiRatio;


						    if(realViewportWidth >= 1200 || (!gallery.likelyTouchDevice && realViewportWidth > 800) || screen.width > 1200 ) {
						    	if(!useLargeImages) {
						    		useLargeImages = true;
						        	imageSrcWillChange = true;
						    	}
						        
						    } else {
						    	if(useLargeImages) {
						    		useLargeImages = false;
						        	imageSrcWillChange = true;
						    	}
						    }

						    if(imageSrcWillChange && !firstResize) {
						        gallery.invalidateCurrItems();
						    }

						    if(firstResize) {
						        firstResize = false;
						    }

						    imageSrcWillChange = false;

						});

						gallery.listen('gettingData', function(index, item) {
						    if( useLargeImages ) {
						        item.src = item.o.src;
						        item.w = item.o.w;
						        item.h = item.o.h;
						    } else {
						        item.src = item.m.src;
						        item.w = item.m.w;
						        item.h = item.m.h;
						    }
						});

					    gallery.init();
					};

					// select all gallery elements
					var galleryElements = document.querySelectorAll( gallerySelector );
					for(var i = 0, l = galleryElements.length; i < l; i++) {
						galleryElements[i].setAttribute('data-pswp-uid', i+1);
						galleryElements[i].onclick = onThumbnailsClick;
					}

					// Parse URL and open gallery if it contains #&pid=3&gid=1
					var hashData = photoswipeParseHash();
					if(hashData.pid && hashData.gid) {
						openPhotoSwipe( hashData.pid,  galleryElements[ hashData.gid - 1 ], true, true );
					}
				};
				initPhotoSwipeFromDOM('.demo-gallery');
			})();
		</script>

<script type="text/javascript">
/* ParadiseRP - contraste robuste des métadonnées photo rendues dynamiquement */
(function(){
    'use strict';

    function cleanText(value){
        return (value || '').replace(/\s+/g, ' ').trim().toUpperCase();
    }

    function isTakenLabel(value){
        var text = cleanText(value);
        return /^(PRISE?|PRIS)\s+(LE|A|À)$/.test(text) || /^(PRISE?|PRIS)\s+(LE|A|À)\s*[:\-]?$/.test(text);
    }

    function directText(el){
        var out = '';
        Array.prototype.forEach.call(el.childNodes || [], function(node){
            if(node.nodeType === 3) out += ' ' + node.nodeValue;
        });
        return out.trim();
    }

    function parseRgb(value){
        var match = String(value || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/i);
        return match ? [parseInt(match[1],10), parseInt(match[2],10), parseInt(match[3],10)] : null;
    }

    function effectiveBackground(el){
        var node = el;
        while(node && node !== document.documentElement){
            var style = window.getComputedStyle(node);
            var bg = parseRgb(style.backgroundColor);
            if(bg && style.backgroundColor.indexOf('rgba') === -1) return bg;
            if(bg){
                var alpha = String(style.backgroundColor).match(/rgba\([^,]+,[^,]+,[^,]+,\s*([\d.]+)/i);
                if(!alpha || parseFloat(alpha[1]) > .65) return bg;
            }
            node = node.parentElement;
        }
        return [10,18,28];
    }

    function isLight(bg){
        return ((bg[0] * 299 + bg[1] * 587 + bg[2] * 114) / 1000) > 150;
    }

    function forceStyle(el, color, shadow){
        if(!el || !el.style) return;
        el.style.setProperty('color', color, 'important');
        el.style.setProperty('opacity', '1', 'important');
        el.style.setProperty('visibility', 'visible', 'important');
        el.style.setProperty('font-weight', '800', 'important');
        el.style.setProperty('text-shadow', shadow, 'important');
    }

    function fixMetadata(){
        var phone = document.getElementById('phone');
        if(!phone) return;

        var nodes = phone.querySelectorAll('div,span,p,small,strong,b,label,time');
        Array.prototype.forEach.call(nodes, function(el){
            var own = cleanText(directText(el));
            var full = cleanText(el.textContent);
            if(!isTakenLabel(own) && !(full.length <= 20 && isTakenLabel(full))) return;

            var box = el.parentElement || el;
            var bg = effectiveBackground(box);
            var light = isLight(bg);
            var color = light ? '#101722' : '#F7FAFF';
            var secondary = light ? '#253247' : '#FFFFFF';
            var shadow = light ? '0 1px 0 rgba(255,255,255,.45)' : '0 1px 3px rgba(0,0,0,.95)';

            forceStyle(el, color, shadow);

            Array.prototype.forEach.call(box.children || [], function(child){
                var text = cleanText(child.textContent);
                if(child === el || !text || text.length > 45) return;
                if(/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/.test(text) || /\d{1,2}:\d{2}/.test(text)) {
                    forceStyle(child, secondary, shadow);
                    child.style.setProperty('font-weight', '800', 'important');
                }
            });

            var sibling = el.nextElementSibling;
            if(sibling){
                var siblingText = cleanText(sibling.textContent);
                if(/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/.test(siblingText) || /\d{1,2}:\d{2}/.test(siblingText)) {
                    forceStyle(sibling, secondary, shadow);
                }
            }

            box.style.setProperty('opacity', '1', 'important');
        });
    }

    var queued = false;
    function queueFix(){
        if(queued) return;
        queued = true;
        window.requestAnimationFrame(function(){
            queued = false;
            fixMetadata();
        });
    }

    function start(){
        fixMetadata();
        var phone = document.getElementById('phone');
        if(!phone) return;
        new MutationObserver(queueFix).observe(phone, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['class','style']});
        document.addEventListener('click', function(){ window.setTimeout(fixMetadata, 0); window.setTimeout(fixMetadata, 120); }, true);
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
})();
</script>
