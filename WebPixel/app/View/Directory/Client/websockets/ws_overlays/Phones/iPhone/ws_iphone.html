<script>
(function(){
    function lockPhoneGrid(){
        document.querySelectorAll('#phone .column').forEach(function(el){
            el.setAttribute('draggable','false');
            el.addEventListener('dragstart', function(e){ e.preventDefault(); });
        });
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lockPhoneGrid);
    else lockPhoneGrid();
    setTimeout(lockPhoneGrid, 250);
})();
</script>
