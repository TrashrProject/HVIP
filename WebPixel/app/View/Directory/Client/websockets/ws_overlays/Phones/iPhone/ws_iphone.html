<script>
(function(){
    var dragItem = null;
    var dragContainer = null;
    var dragMoved = false;
    var suppressClickUntil = 0;

    function storageAvailable(){
        try{
            var x='__rdp_phone_test__';
            localStorage.setItem(x,x);
            localStorage.removeItem(x);
            return true;
        }catch(e){ return false; }
    }

    var canStore = storageAvailable();

    function getKey(item){
        if(!item) return '';
        return item.getAttribute('data-rdp-key') || ((item.querySelector('.appicon') || {}).dataset || {}).app || '';
    }

    function saveOrder(container, key){
        if(!canStore || !container) return;
        var order = Array.prototype.map.call(container.children, function(item){ return getKey(item); }).filter(Boolean);
        try{ localStorage.setItem(key, JSON.stringify(order)); }catch(e){}
    }

    function restoreOrder(container, key){
        if(!canStore || !container) return;
        var order;
        try{ order = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ order = []; }
        if(!Array.isArray(order) || !order.length) return;
        var items = {};
        Array.prototype.forEach.call(container.children, function(item){ items[getKey(item)] = item; });
        order.forEach(function(appKey){ if(items[appKey]) container.appendChild(items[appKey]); });
    }

    function clearTargets(container){
        if(!container) return;
        container.querySelectorAll('.rdp-drop-target').forEach(function(el){ el.classList.remove('rdp-drop-target'); });
    }

    function bindReorder(container, itemSelector, storageKey){
        if(!container || container.dataset.rdpReorderBound === '1') return;
        container.dataset.rdpReorderBound = '1';
        restoreOrder(container, storageKey);

        function prepareItems(){
            container.querySelectorAll(itemSelector).forEach(function(item){
                item.setAttribute('draggable','true');
                if(item.dataset.rdpDragBound === '1') return;
                item.dataset.rdpDragBound = '1';

                item.addEventListener('dragstart', function(e){
                    dragItem = item;
                    dragContainer = container;
                    dragMoved = false;
                    clearTargets(container);
                    try{
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', getKey(item));
                    }catch(_){}
                    requestAnimationFrame(function(){ item.classList.add('rdp-dragging'); });
                });

                item.addEventListener('dragend', function(){
                    item.classList.remove('rdp-dragging');
                    clearTargets(container);
                    if(dragMoved){
                        saveOrder(container, storageKey);
                        suppressClickUntil = Date.now() + 350;
                    }
                    dragItem = null;
                    dragContainer = null;
                    dragMoved = false;
                });
            });
        }

        prepareItems();

        container.addEventListener('dragover', function(e){
            if(!dragItem || dragContainer !== container) return;
            e.preventDefault();
            var target = e.target.closest(itemSelector);
            if(!target || target === dragItem || target.parentNode !== container) return;

            clearTargets(container);
            target.classList.add('rdp-drop-target');

            var rect = target.getBoundingClientRect();
            var before = e.clientX < rect.left + rect.width / 2;
            if(before) container.insertBefore(dragItem, target);
            else container.insertBefore(dragItem, target.nextSibling);
            dragMoved = true;
        });

        container.addEventListener('drop', function(e){
            if(!dragItem || dragContainer !== container) return;
            e.preventDefault();
            clearTargets(container);
            saveOrder(container, storageKey);
            suppressClickUntil = Date.now() + 350;
        });
    }

    function sendPhoneApp(app){
        if(!app || !window.rdp || !window.rdp_app || !rdp_app.webSocket) return;
        try{
            rdp['sendData']('event_phone', 'in_app,' + app + ',', false, false, rdp_app['webSocket'], rdp_app['startedSocket'], rdp_app['UserID']);
        }catch(e){
            console.warn('[RDP Pocket] impossible d\'ouvrir l\'application', app, e);
        }
    }

    function openWhatsAppLocal(){
        if(!window.jQuery) return;
        $('#AppViewer').hide();
        $('#app_WhatsApp').show();
        $('#app_WhatsApp > .app_WhatsApp').show().css('display','inherit');
        $('.Whats_Title').show();
        $('#What_Menu').show();
        $('#WS_WhatsApp').show();
        $('#WS_WhatsApp_Contacts').hide();
        $('#WS_WhatsApp_Chatting').hide();
        $('#WhatsChats').addClass('selected');
        $('#WhatsContacts').removeClass('selected');
    }

    function initPhoneInteractions(){
        var phoneContent = document.getElementById('phone_content');
        var grid = document.querySelector('#phone .rdp-app-grid');
        var dock = document.querySelector('#phone #dock_apps.rdp-dock');
        if(!phoneContent || !grid || !dock) return;

        bindReorder(grid, '.rdp-app-tile', 'rdpPocketGridOrderV12');
        bindReorder(dock, '.rdp-dock-app', 'rdpPocketDockOrderV12');

        if(phoneContent.dataset.rdpClickFix === '1') return;
        phoneContent.dataset.rdpClickFix = '1';

        phoneContent.addEventListener('click', function(e){
            if(Date.now() < suppressClickUntil){
                e.preventDefault();
                e.stopImmediatePropagation();
                return;
            }

            var icon = e.target.closest('.appicon[data-app="_WhatsApp"]');
            if(!icon || !phoneContent.contains(icon)) return;

            // WhatsApp is rendered locally immediately, then the emulator is
            // still asked for the current conversations/contacts as before.
            e.preventDefault();
            e.stopImmediatePropagation();
            openWhatsAppLocal();
            sendPhoneApp('_WhatsApp');
        }, true);
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPhoneInteractions);
    else initPhoneInteractions();
    setTimeout(initPhoneInteractions, 250);
    setTimeout(initPhoneInteractions, 1000);
})();
</script>
