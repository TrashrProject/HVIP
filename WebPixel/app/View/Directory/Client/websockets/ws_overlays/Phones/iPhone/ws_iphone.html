<script>
(function(){
    function protectPhoneHome(){
        document.querySelectorAll('#phone .rdp-app-tile,#phone .rdp-dock-app').forEach(function(el){
            el.setAttribute('draggable','false');
            el.addEventListener('dragstart', function(e){ e.preventDefault(); });
        });
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', protectPhoneHome);
    else protectPhoneHome();
    setTimeout(protectPhoneHome,250);
})();
</script>
