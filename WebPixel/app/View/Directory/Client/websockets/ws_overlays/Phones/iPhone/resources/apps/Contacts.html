<style id="paradise-contacts-actions-fix">

 */

  display:flex!important;

  gap:9px!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
}

#app_Contacts #WS_Contacts .app_contacts_avatar{
  position:relative!important;
  float:none!important;
  display:block!important;

  min-width:44px!important;
  max-width:44px!important;
  height:44px!important;
  min-height:44px!important;
  max-height:44px!important;
  margin:0!important;
  padding:0!important;
  border-radius:50%!important;
  overflow:hidden!important;
  transform:none!important;
  background-repeat:no-repeat!important;
  background-position:center -8px!important;
  background-size:auto 64px!important;
  background-color:#203348!important;
}

#app_Contacts #WS_Contacts .app_contacts_avatar img,
#app_Contacts #WS_Contacts .rdp-habbo-avatar-img{
