<script>
(function(){
    function filterRows(inputSelector, containerSelector){
        var input = document.querySelector(inputSelector);
        var container = document.querySelector(containerSelector);
        if(!input || !container || input.dataset.rdpBound === '1') return;
        input.dataset.rdpBound = '1';
        input.addEventListener('input', function(){
            var term = (this.value || '').toLowerCase().trim();
            container.querySelectorAll('.app_msg_content').forEach(function(row){
                row.style.display = !term || row.textContent.toLowerCase().indexOf(term) !== -1 ? '' : 'none';
            });
        });
    }

    function normalizeMessageTimes(root){
        var scope = root && root.querySelectorAll ? root : document;
        scope.querySelectorAll('#app_WhatsApp .Msg_From_Whats,#app_WhatsApp .Msg_To_Whats').forEach(function(bubble){
            var raw = bubble.getAttribute('title') || '';
            var match = raw.match(/(?:^|\s)(\d{1,2}:\d{2})(?::\d{2})?/);
            if(!match) match = raw.match(/(\d{1,2}:\d{2})/);
            bubble.setAttribute('data-rdp-time', match ? match[1] : '');
        });
    }

    function scrollChatToBottom(){
        var box = document.getElementById('app_whats_messages');
        if(!box) return;
        requestAnimationFrame(function(){ box.scrollTop = box.scrollHeight; });
    }

    function bindWhatsSearch(){
        filterRows('#WhatsSearchChats','#WS_WhatsApp');
        filterRows('#WhatsSearchContacts','#WS_WhatsApp_Contacts');
    }

    function initWhatsUi(){
        bindWhatsSearch();
        normalizeMessageTimes(document);
        var messages = document.getElementById('app_whats_messages');
        if(messages && messages.dataset.rdpObserver !== '1'){
            messages.dataset.rdpObserver = '1';
            new MutationObserver(function(mutations){
                mutations.forEach(function(mutation){
                    mutation.addedNodes.forEach(function(node){
                        if(node.nodeType === 1) normalizeMessageTimes(node.parentNode || node);
                    });
                });
                normalizeMessageTimes(messages);
                scrollChatToBottom();
            }).observe(messages,{childList:true,subtree:true});
        }
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWhatsUi);
    else initWhatsUi();
    setTimeout(initWhatsUi,250);
    setTimeout(initWhatsUi,900);
})();
</script>
