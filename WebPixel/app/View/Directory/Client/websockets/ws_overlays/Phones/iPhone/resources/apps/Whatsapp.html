<script>
(function(){
    'use strict';
    var incomingPatched=false,lastRefresh=0;

    function wsReady(){return window.rdp&&window.rdp_app&&rdp_app.webSocket&&rdp_app.startedSocket;}
    function sendPhone(action){if(!wsReady())return false;try{rdp.sendData('event_phone',action,false,false,rdp_app.webSocket,rdp_app.startedSocket,rdp_app.UserID);return true;}catch(e){return false;}}
    function refreshWhatsApp(force){var now=Date.now();if(!force&&now-lastRefresh<700)return;lastRefresh=now;sendPhone('open_whatsapp,');}
    function refreshContacts(){sendPhone('open_contacts,');}
    function activeList(){return document.getElementById('WhatsContacts')&&document.getElementById('WhatsContacts').classList.contains('selected')?document.getElementById('WS_WhatsApp_Contacts'):document.getElementById('WS_WhatsApp');}
    function filterCurrentList(){var input=document.getElementById('WhatsUniversalSearch'),list=activeList();if(!input||!list)return;var term=(input.value||'').toLowerCase().trim();list.querySelectorAll('.app_msg_content').forEach(function(row){row.style.display=!term||row.textContent.toLowerCase().indexOf(term)!==-1?'':'none';});}
    function showChats(){var a=document.getElementById('WhatsChats'),b=document.getElementById('WhatsContacts'),c=document.getElementById('WS_WhatsApp'),d=document.getElementById('WS_WhatsApp_Contacts');if(a)a.classList.add('selected');if(b)b.classList.remove('selected');if(c)c.style.display='';if(d)d.style.display='none';filterCurrentList();}
    function showContacts(){var a=document.getElementById('WhatsChats'),b=document.getElementById('WhatsContacts'),c=document.getElementById('WS_WhatsApp'),d=document.getElementById('WS_WhatsApp_Contacts');if(a)a.classList.remove('selected');if(b)b.classList.add('selected');if(c)c.style.display='none';if(d)d.style.display='';refreshWhatsApp(true);filterCurrentList();}
    function backToList(){var title=document.querySelector('#app_WhatsApp .Whats_Title'),menu=document.getElementById('What_Menu'),chat=document.getElementById('WS_WhatsApp_Chatting');if(title)title.style.display='';if(menu)menu.style.display='';if(chat)chat.style.display='none';showChats();refreshWhatsApp(true);}
    function normalizeTime(raw){var m=String(raw||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?/g);if(!m||!m.length)return'';var p=m[m.length-1].split(':');return String(p[0]).padStart(2,'0')+':'+p[1];}
    function scrollMessages(smooth){var box=document.getElementById('app_whats_messages');if(!box)return;requestAnimationFrame(function(){requestAnimationFrame(function(){if(smooth&&box.scrollTo)box.scrollTo({top:box.scrollHeight,behavior:'smooth'});else box.scrollTop=box.scrollHeight;});});}
    function enhanceMessages(){document.querySelectorAll('#app_WhatsApp .Msg_From_Whats,#app_WhatsApp .Msg_To_Whats').forEach(function(b){b.setAttribute('data-rdp-time',normalizeTime(b.getAttribute('title')));});scrollMessages(false);}
    function escapeHtml(text){return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
    function appendPending(text){var box=document.getElementById('app_whats_messages');if(!box)return;var row=document.createElement('div');row.className='Msg_Container rdp-pending-row';var b=document.createElement('div');b.className='Msg_To_Whats rdp-pending';var n=new Date();b.setAttribute('data-rdp-time',String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));b.textContent=text;row.appendChild(b);box.appendChild(row);scrollMessages(true);}
    function closeEmojiPanel(){var p=document.getElementById('RdpWaEmojiPanel'),t=document.getElementById('RdpWaEmojiToggle');if(p)p.hidden=true;if(t)t.classList.remove('active');}
    function sendWhatsApp(){var input=document.getElementById('mensaje'),name=document.querySelector('#app_WhatsApp .app_whats_name');if(!input||!name)return;var raw=(input.value||'').trim(),to=(name.textContent||'').trim();if(!raw||!to||to==='Contact')return;var clean=raw.replace(/\|/g,'¦'),encoded=escapeHtml(clean).replace(/\r?\n/g,'::br::');appendPending(clean);input.value='';closeEmojiPanel();if(!sendPhone('send_whatsapp,|'+encoded+'|'+to)){var pending=document.querySelector('#app_whats_messages .rdp-pending-row:last-child');if(pending)pending.remove();input.value=raw;}}
    function insertEmoji(emoji){var input=document.getElementById('mensaje');if(!input)return;input.focus();var s=typeof input.selectionStart==='number'?input.selectionStart:input.value.length,e=typeof input.selectionEnd==='number'?input.selectionEnd:input.value.length;if(input.setRangeText)input.setRangeText(emoji,s,e,'end');else input.value=input.value.slice(0,s)+emoji+input.value.slice(e);}
    function toggleEmojiPanel(){var p=document.getElementById('RdpWaEmojiPanel'),t=document.getElementById('RdpWaEmojiToggle');if(!p)return;p.hidden=!p.hidden;if(t)t.classList.toggle('active',!p.hidden);}
    function ensureToastStack(){var s=document.getElementById('RdpPhoneToastStack');if(s)return s;s=document.createElement('div');s.id='RdpPhoneToastStack';s.className='rdp-phone-toast-stack';document.body.appendChild(s);return s;}
    function notifyOnline(username){username=String(username||'').trim();if(!username)return;var stack=ensureToastStack(),toast=document.createElement('div');toast.className='rdp-phone-toast';toast.innerHTML='<div class="rdp-phone-toast-icon">✓</div><strong></strong><span>vient de se connecter • En ligne</span>';toast.querySelector('strong').textContent=username;stack.appendChild(toast);requestAnimationFrame(function(){toast.classList.add('show');});setTimeout(function(){toast.classList.add('hide');setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},250);},4200);var open=document.querySelector('#app_WhatsApp .app_whats_name');if(open&&(open.textContent||'').trim().toLowerCase()===username.toLowerCase()){var state=document.querySelector('#app_WhatsApp .app_whats_lastonline');if(state)state.innerHTML='en ligne';}refreshWhatsApp(true);}
    function patchIncoming(){if(incomingPatched||!window.rdp||typeof rdp.IncomingPacket!=='function')return false;var original=rdp.IncomingPacket;rdp.IncomingPacket=function(RDPEvent,ExtraData,EventData,UName,UID){var action=String(ExtraData||'').trim();if(RDPEvent==='compose_phone'&&action==='contact_online')notifyOnline(EventData&&EventData[2]);var result=original.apply(this,arguments);if(RDPEvent==='compose_phone'){if(action==='open_whatsapp')setTimeout(function(){filterCurrentList();if(document.getElementById('WhatsContacts')&&document.getElementById('WhatsContacts').classList.contains('selected')){var c=document.getElementById('WS_WhatsApp'),d=document.getElementById('WS_WhatsApp_Contacts');if(c)c.style.display='none';if(d)d.style.display='';}},0);if(action==='open_whatschats'||action==='update_whatschats')setTimeout(function(){document.querySelectorAll('#app_whats_messages .rdp-pending-row').forEach(function(row){row.remove();});enhanceMessages();var input=document.getElementById('mensaje');if(input)input.value='';},0);}return result;};incomingPatched=true;return true;}
    function bind(){var chats=document.getElementById('WhatsChats'),contacts=document.getElementById('WhatsContacts'),search=document.getElementById('WhatsUniversalSearch'),back=document.querySelector('#app_WhatsApp .whats-back'),send=document.querySelector('#app_WhatsApp .rdp-wa-send'),input=document.getElementById('mensaje'),toggle=document.getElementById('RdpWaEmojiToggle'),panel=document.getElementById('RdpWaEmojiPanel');if(chats&&!chats.dataset.rdp14){chats.dataset.rdp14='1';chats.addEventListener('click',showChats);}if(contacts&&!contacts.dataset.rdp14){contacts.dataset.rdp14='1';contacts.addEventListener('click',showContacts);}if(search&&!search.dataset.rdp14){search.dataset.rdp14='1';search.addEventListener('input',filterCurrentList);}if(back&&!back.dataset.rdp14){back.dataset.rdp14='1';back.addEventListener('click',backToList);}if(send&&!send.dataset.rdp14){send.dataset.rdp14='1';send.addEventListener('click',sendWhatsApp);}if(input&&!input.dataset.rdp14){input.dataset.rdp14='1';input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendWhatsApp();}});}if(toggle&&!toggle.dataset.rdp14){toggle.dataset.rdp14='1';toggle.addEventListener('click',toggleEmojiPanel);}if(panel&&!panel.dataset.rdp14){panel.dataset.rdp14='1';panel.addEventListener('click',function(e){var btn=e.target.closest('button');if(btn)insertEmoji(btn.textContent);});}var messages=document.getElementById('app_whats_messages');if(messages&&!messages.dataset.rdpObserver){messages.dataset.rdpObserver='1';new MutationObserver(enhanceMessages).observe(messages,{childList:true,subtree:true});}if(!document.documentElement.dataset.rdpPhoneSpecialApps){document.documentElement.dataset.rdpPhoneSpecialApps='1';document.addEventListener('click',function(e){var icon=e.target.closest&&e.target.closest('#phone .appicon[data-app]');if(!icon)return;var app=icon.getAttribute('data-app')||'';if(app==='_WhatsApp'||app==='WhatsApp')setTimeout(function(){refreshWhatsApp(true);},80);else if(app==='_Contacts'||app==='Contacts')setTimeout(refreshContacts,80);else if(app==='_Messages'||app==='Messages')setTimeout(function(){sendPhone('open_chatrooms,');},80);},true);}patchIncoming();enhanceMessages();}
    function boot(){bind();var tries=0,t=setInterval(function(){bind();if(patchIncoming()||incomingPatched||++tries>40)clearInterval(t);},250);}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
