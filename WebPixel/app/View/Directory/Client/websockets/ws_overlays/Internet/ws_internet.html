<script>
var curPage = "HomePage";
var curButtonText = $("#goToStaffTool").text();

function HomePage(){
  var iframe = document.getElementById('webFrame');
  iframe.src = iframe.src;

  $("#staffToolFrame").hide();
  $("#webFrame").show();
}

function StaffTool(){
  var iframe = document.getElementById('staffToolFrame');
  iframe.src = iframe.src;

  $("#webFrame").hide();
  $("#staffToolFrame").show();
}

function ToggleStaffTool() {
  if (curPage == "HomePage") {
    StaffTool();
    curPage = "StaffTool";
    $("#goToStaffTool").html("<< Volver");
  }
  else {
    HomePage();
    curPage = "HomePage";
    $("#goToStaffTool").html(curButtonText);
  }
}
</script>
