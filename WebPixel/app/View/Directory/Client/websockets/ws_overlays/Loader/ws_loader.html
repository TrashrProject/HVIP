var LoaderPerc = 0;
function animateValue(id, start, end, duration) {
  var range = end - start;
  var current = start;
  var increment = end > start? 1 : -1;
  var stepTime = Math.abs(Math.floor(duration / range));
  var obj = document.getElementById(id);
  var timer = setInterval(function() {
      current += increment;
      obj.innerHTML = current + "%";
      if (current == end) {
          clearInterval(timer);
      }
  }, stepTime);
}

function SumLoader(perc, vel){
  animateValue("LoaderPerc", LoaderPerc, (LoaderPerc + perc), vel);
  LoaderPerc += perc;

  if(LoaderPerc == 76)
    Check76Perc();

  var tmm = setInterval(function() {
    if(LoaderPerc >= 100){
      //$('#particles_loader').fadeTo("slow", 0);
      getSoundAndFadeAudio("LoadScnAudio");
      var animationTime = 2500;
      $('#particles_loader').animate({top: (parseInt($('#particles_loader').css('top')) / 2) + 'px'}, animationTime / 2, 'linear', 
      function() {
        $('#particles_loader').animate({
          top: '0px',
          opacity: 0
        },animationTime / 2, 'linear', 
        function() {
          $('#particles_loader').remove();
        });
      });

    }
    clearInterval(tmm);
  }, 2500);
}

function SetPhrase() {
  var P = "";
  var R = Math.floor(Math.random() * 5);

  if(R == 0)
    P = "Activa el modo combate y ataca con un clic a tus objetivos.";
  else if(R == 1)
    P = "¿Te has perdido? Usa el comando <b>:mapa</b> para ubicarte.";
  else if(R == 2)
    P = "Si no recuerdas algún comando, podrás econtrarlo diciendo <b>:ayuda</b>.";
  else if(R == 3)
    P = "¡Ayuda y déjate ayudar! Usa el comando <b>:n [pregunta]</b> para recibir asistencia de otros usuarios.";
  else if(R == 4)
    P = "Puedes capturar territorios dando doble clic a la bandera en un Barrio.";

  $('.loader-tips').html(P);
}

function Check76Perc(){
  var Counter = 0;
  var tmm2 = setInterval(function() {
    if(LoaderPerc == 76){
      Counter++;
      if(Counter == 45)
      {
        $('.loader-tips').html("<b style='color:red'>¿No te carga? Refresca la página. Si el problema sigue, contacta a un administrador en <a href='<?php echo Config::$DiscordInvite; ?>' target='_blank'>nuestro Discord</a>.</b>");
        clearInterval(tmm2);
      }
    }
    else
      clearInterval(tmm2);
  }, 1000);
}

function getSoundAndFadeAudio (audiosnippetId) {
    var sound = document.getElementById(audiosnippetId);
    // Set the point in playback that fadeout begins. This is for a 2 second fade out.
    //var fadePoint = sound.duration - 2; 

    var fadeAudio = setInterval(function () {
        // Only fade if past the fade out point or not at zero already
        if (sound.volume != 0.0/*(sound.currentTime >= fadePoint) && (sound.volume != 0.0)*/) {
            if((sound.volume - 0.1) < 0.0)
              sound.volume = 0.0
            else
              sound.volume -= 0.1;
        }
        // When volume at zero stop all the intervalling
        if (sound.volume <= 0.0) {
          clearInterval(fadeAudio);
        }
    }, 200);
}
