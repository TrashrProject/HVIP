    <link rel="stylesheet" href="./paradise-dock-redesign.css?v=82" id="paradise-rp-polish-css">

    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
    </style>

    <script>
      (() => {
        'use strict';

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(registrations => registrations.forEach(registration => registration.unregister()))
            .catch(error => console.warn('[ParadiseRP:stable-ui] service worker cleanup failed', error));
        }

        const TRANSPARENT_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL8WQAAAABJRU5ErkJggg==';
        const rewriteLegacyUrl = value => {
          let url = String(value || '');
          if (!url) return url;
          url = url.replace(/^https?:\/\/swf\.habbovip\.us\/V5-0-2\/?/i, 'https://paradiserp.fr/swf_pz/V5-0-2/');
          url = url.replace(/^https?:\/\/swfs?\.habbovip\.us\/V5-0-2\/?/i, 'https://paradiserp.fr/swf_pz/V5-0-2/');
          url = url.replace(/^https?:\/\/swfs?\.habbo\.vip\/V5-0-2\/?/i, 'https://paradiserp.fr/swf_pz/V5-0-2/');
          url = url.replace(/^https?:\/\/images\.habbovip\.us\/V5-0-2\/?/i, 'https://paradiserp.fr/swf_pz/V5-0-2/');
          url = url.replace(/^https?:\/\/habbovip\.us\/?/i, 'https://paradiserp.fr/');
          if (/^https?:\/\/nitro-imager\.kubbo\.city\//i.test(url)) {
            const q = url.indexOf('?');
            return 'https://paradiserp.fr/avatar-placeholder.php' + (q >= 0 ? url.substring(q) : '');
          }
          if (/^\?figure=/i.test(url)) return 'https://paradiserp.fr/avatar-placeholder.php' + url;
          if (/platinos(?:%20|\s|_)+icon(?:%20|\s|_)+s\.png/i.test(url)) return TRANSPARENT_PNG;
          if (/(?:^|\/)styles\.[a-z0-9_-]+\.css(?:\?|$)/i.test(url)) return './empty-legacy.css';
          return url;
        };

        window.__rewriteLegacyNitroUrl = rewriteLegacyUrl;

        if (window.fetch) {
          const nativeFetch = window.fetch.bind(window);
          window.fetch = function(input, init) {
            try {
              const raw = input && input.url ? input.url : input;
              const next = rewriteLegacyUrl(raw);
              if (typeof input === 'string' || input instanceof URL) return nativeFetch(next, init);
              if (input instanceof Request && next !== raw) return nativeFetch(new Request(next, input), init);
            } catch (error) {
              console.warn('[ParadiseRP:stable-ui] asset fetch rewrite failed', error);
            }
            return nativeFetch(input, init);
          };
        }

        const nativeOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          arguments[1] = rewriteLegacyUrl(url);
          return nativeOpen.apply(this, arguments);
        };

        const patchUrlProperty = (prototype, property) => {
          const descriptor = Object.getOwnPropertyDescriptor(prototype, property);
          if (!descriptor || !descriptor.set) return;
          Object.defineProperty(prototype, property, {
            get: descriptor.get,
            set(value) { return descriptor.set.call(this, rewriteLegacyUrl(value)); },
            configurable: true,
            enumerable: descriptor.enumerable
          });
        };

        patchUrlProperty(HTMLImageElement.prototype, 'src');
        patchUrlProperty(HTMLSourceElement.prototype, 'src');
        patchUrlProperty(HTMLLinkElement.prototype, 'href');

        const query = new URLSearchParams(window.location.search);
        const sso = query.get('sso') || null;

        window.NitroConfig = {
          'config.urls': ['./local-config.json', './renderer-config.json', './ui-config.json'],
          'sso.ticket': sso,
          'forward.type': -1,
          'forward.id': 0,
          'friend.id': Number.parseInt(query.get('friend') || '0', 10) || 0,
          'roomenterad.habbohotel.enabled': false,
          'roomenterad.habblet.enabled': false
        };

        window.__PARADISE_BASELINE__ = {
          version: '1.4.0-stable-ui-event-isolation',
          paradiseUi: 'hud-native-cleanup-polish-stable-events',
          websocketPatched: false,
          domCleanup: true,
          roomTrace: false,
          stabilityPatch: false,
          chatFix: false,
          polish: true,
          stableUiFixes: true,
          eventIsolation: true,
          hasSso: !!sso
        };

        console.info('[ParadiseRP] Stable UI interaction test active', window.__PARADISE_BASELINE__);
      })();
    </script>
