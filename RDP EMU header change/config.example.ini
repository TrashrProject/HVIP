# RDP Emulator - local XAMPP configuration

# Database
db.hostname=127.0.0.1
db.port=3306
db.username=root
db.password=
db.name=hv_rp
db.pool.minsize=1
db.pool.maxsize=50

# MUS socket used by pz_api
mus.tcp.bindip=127.0.0.1
mus.tcp.port=3043
mus.tcp.allowedaddr=127.0.0.1;::1

# Habbo client socket
game.tcp.port=2021
game.tcp.conlimit=500
game.tcp.conperip=20
game.tcp.enablenagles=false

# Roleplay websocket used by the CMS/client
# ws is the normal local/dev protocol. wss requires the pfx and password values below.
ws.certificate.protocol=ws
ws.certificate.pfx=
ws.certificate.password=
ws.tcp.bindip=127.0.0.1
ws.tcp.port=2087

# AntiMutant avatar figure data
# Relative paths are resolved from the emulator output folder first, then the project folder.
antimutant.figuredata.path=extra/figuredata.xml
