<canvas id="Canvas_Map" width="825" height="370" style="background-color: grey;"></canvas>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
<script src="dist/canvas-manipulation.min.js"></script>
<script src="dist/canvas-manipulation-mouse-listeners.min.js"></script>

<script type="text/javascript">
var Canvas_Map = document.getElementById('Canvas_Map');
var context = Canvas_Map.getContext('2d');

var control = new CanvasManipulation(Canvas_Map, function () {
  draw(context);
});
control.init();
control.layout();

$('#Canvas_Map').mousemove(function(e) {
    var pos = findPos(this);
    var x = e.pageX - pos.x;
    var y = e.pageY - pos.y;
    var coord = "x=" + x + ", y=" + y;
    var c = this.getContext('2d');
    var p = c.getImageData(x, y, 1, 1).data; 
    if(p[3] != 0)
    	console.log("Entramos: " + coord);
});

function findPos(obj) {
    var curleft = 0, curtop = 0;
    if (obj.offsetParent) {
        do {
            curleft += obj.offsetLeft;
            curtop += obj.offsetTop;
        } while (obj = obj.offsetParent);
        return { x: curleft, y: curtop };
    }
    return undefined;
}

function rgbToHex(r, g, b) {
    if (r > 255 || g > 255 || b > 255)
      throw "Invalid color component";
    return ((r << 16) | (g << 8) | b).toString(16);
}

function randomInt(max) {
  return Math.floor(Math.random() * max);
}

function randomColor() {
	return `rgb(${randomInt(256)}, ${randomInt(256)}, ${randomInt(256)})`
}

function draw(ctx) {
  ctx.clearCanvas();
  // GRANGE
  context.drawImage(GRANGE, 412, 0, GRANGE.width/10, GRANGE.height/10);
}

// GRANGE
var GRANGE = new Image();
GRANGE.src = "https://swf.habbovip.us/MPU/pz/pz_grange.png";
